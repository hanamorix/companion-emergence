name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual run of chosen tests on a chosen OS (only the `python` job runs; see below).
  workflow_dispatch:
    inputs:
      tests:
        description: >-
          Test paths or node ids, separated by spaces (default: the whole suite).
          Example: tests/bridge/test_x.py::test_y
        type: string
        required: false
        default: ""
      os:
        description: Which OS to run on
        type: choice
        options:
          - all
          - ubuntu-latest
          - macos-latest
          - windows-latest
        default: all
      workers:
        description: >-
          pytest-xdist worker processes (#540): 1 is the serial run, auto is one worker per CPU.
          Any other value than 1 also switches on --dist loadgroup and turns off the tdd-guard plugin.
        type: choice
        options:
          - "1"
          - "2"
          - "4"
          - "auto"
        default: "1"
      seed:
        description: >-
          pytest-randomly seed to reproduce a red random order (digits only; empty = a fresh random seed). Use
          workers 1 for a faithful reproduction.
        type: string
        required: false
        default: ""

jobs:
  python:
    name: python ${{ matrix.os }}
    # A hung parallel trial must not hold a runner for the default six hours.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # Push and pull_request: Ubuntu and macOS; Windows runs as shards in `python-windows` (#746). A manual run
        # narrows this to the chosen OS, or all three (Windows unsharded) for `all` (`os` is a choice input, so only
        # the four listed values exist).
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && (inputs.os != 'all' && format('["{0}"]', inputs.os) || '["ubuntu-latest","macos-latest","windows-latest"]') || '["ubuntu-latest","macos-latest"]') }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras

      # #540: the suite runs in parallel (pytest-xdist, one worker per CPU). `--dist loadgroup` keeps each
      # xdist_group mark's tests on one worker (the tests sharing a real resource: the Hugging Face cache, the
      # systemd user manager, a network install); `-p no:tdd-guard` stops the tdd-guard plugin, which every worker
      # would otherwise load and make write the same status file. KINDLED_SLOW_BUDGET switches on the slow-test
      # budget (tests/slow_budget.py), on ubuntu only: a test that uses more than 2 s of CPU must say why with
      # @pytest.mark.slow(reason=...); the CPU time of every test over 0.5 s is logged on all three systems (uploaded
      # below). Test order is
      # random (pytest-randomly): the seed is printed in the header and at the end; to reproduce a red order run
      # serially with `--randomly-seed=N`, or switch it off with `-p no:randomly`.
      - name: Run pytest
        if: github.event_name != 'workflow_dispatch'
        env:
          KINDLED_SLOW_BUDGET: ${{ matrix.os == 'ubuntu-latest' && '1' || '' }}
          KINDLED_SLOW_BUDGET_LOG: slow-budget-cpu.jsonl
        run: uv run pytest -n auto --dist loadgroup -p no:tdd-guard -v --tb=short --durations=100 --junitxml=pytest-junit.xml

      # Manual run only. The inputs reach the shell as environment variables (never
      # spliced into the script). TESTS is split on all whitespace (newlines included) with
      # globbing switched off, and every word is passed to pytest as one quoted argument.
      # WORKERS other than 1 runs pytest-xdist: `--dist loadgroup` keeps each xdist_group
      # mark's tests on one worker (the tests sharing a real resource), and `-p no:tdd-guard`
      # stops the tdd-guard plugin, which every worker would otherwise load and make write the
      # same status file. The push and pull_request run above uses `-n auto` too; this step
      # defaults to 1 (serial) so a single failing test can be reproduced faithfully. `shell: bash`
      # so the same script runs on all three OSes (Windows would otherwise use pwsh).
      - name: Run pytest (selected tests)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          TESTS: ${{ inputs.tests }}
          WORKERS: ${{ inputs.workers }}
          SEED: ${{ inputs.seed }}
          KINDLED_SLOW_BUDGET: ${{ matrix.os == 'ubuntu-latest' && '1' || '' }}
          KINDLED_SLOW_BUDGET_LOG: slow-budget-cpu.jsonl
        run: |
          case "$WORKERS" in
            1|2|4|auto) ;;
            *) echo "::error::refusing workers '$WORKERS': use 1, 2, 4 or auto"; exit 1 ;;
          esac
          set -f
          selected=($TESTS)
          set +f
          for word in "${selected[@]}"; do
            case "$word" in
              -*) echo "::error::refusing '$word': pass test paths or node ids only, not pytest options"; exit 1 ;;
            esac
          done
          parallel=()
          if [ "$WORKERS" != "1" ]; then
            parallel=(-n "$WORKERS" --dist loadgroup -p no:tdd-guard)
          fi
          seed=()
          if [ -n "$SEED" ]; then
            case "$SEED" in
              *[!0-9]*) echo "::error::refusing seed '$SEED': digits only"; exit 1 ;;
            esac
            seed=(-p randomly "--randomly-seed=$SEED")
          fi
          uv run pytest -v --tb=short --durations=100 --junitxml=pytest-junit.xml "${parallel[@]}" "${seed[@]}" "${selected[@]}"

      # Per-test timings (#540): the junit file carries every test's duration so
      # the slow ones can be found per OS.
      - name: Upload pytest junit report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pytest-junit-${{ matrix.os }}
          path: pytest-junit.xml
          if-no-files-found: warn

      # The CPU time of every test that used more than 0.5 s (tests/slow_budget.py), per OS: the data the
      # @pytest.mark.slow marks are made from.
      - name: Upload the slow-test CPU log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: slow-budget-cpu-${{ matrix.os }}
          path: slow-budget-cpu.jsonl
          if-no-files-found: ignore

      - name: Lint with ruff
        if: github.event_name != 'workflow_dispatch'
        run: uv run ruff check .

  # #746: the Windows suite took 32 to 50 minutes on one runner (its tests add up to about 80 minutes there), the
  # longest check on every PR. It runs as shards on separate runners: `--shard i/N` (tests/shard.py) puts every test in
  # exactly one shard and keeps each xdist_group whole, balanced by tests/shard_durations.json
  # (scripts/refresh_shard_durations.py), and the split does not depend on the random order, so each shard keeps its
  # own fresh seed. A manual run stays one unsharded job in `python` above. To reproduce a red shard, run its seed with
  # the same `--shard i/N`.
  python-windows:
    name: python windows-latest (${{ matrix.shard }}/5)
    if: github.event_name != 'workflow_dispatch'
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # Five, measured on #774: four shards took 11.0 to 12.5 minutes against macOS's 11.6. More xdist workers do not
        # help here (4 workers on the 4-vCPU runner took 33.2 minutes for the whole suite, as 2 did).
        shard: [1, 2, 3, 4, 5]
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run pytest
        env:
          KINDLED_SLOW_BUDGET_LOG: slow-budget-cpu.jsonl
        run: uv run pytest -n auto --dist loadgroup -p no:tdd-guard -v --tb=short --durations=100 --junitxml=pytest-junit.xml --shard=${{ matrix.shard }}/5

      - name: Upload pytest junit report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pytest-junit-windows-latest-${{ matrix.shard }}-of-5
          path: pytest-junit.xml
          if-no-files-found: warn

      - name: Upload the slow-test CPU log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: slow-budget-cpu-windows-latest-${{ matrix.shard }}-of-5
          path: slow-budget-cpu.jsonl
          if-no-files-found: ignore

  # #746: one check says whether Windows passed, whatever the shard count. Skipped (not failed) when a shard was
  # cancelled: rerun-runner-loss.yml re-runs a run only when every job that didn't pass was lost to a runner, and a
  # failing job here would stop that; re-running the cancelled shard re-runs this job too.
  python-windows-result:
    name: python windows-latest
    needs: python-windows
    if: always() && github.event_name != 'workflow_dispatch' && needs.python-windows.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - name: Every Windows shard passed
        env:
          RESULT: ${{ needs.python-windows.result }}
        run: |
          echo "the Windows shards: $RESULT"
          test "$RESULT" = success

  # #540: a test that cannot fail proves nothing. Every NEW test a PR adds must fail against the product
  # code the PR branched from (or be marked `no_base_failure(reason=...)`, which is counted and listed).
  # What "new" means and how to run this locally: CONTRIBUTING.md, "New tests must be able to fail".
  # Pull requests only (a push to main has no base to compare with). The script builds its own git
  # worktrees of the PR head and the merge-base and never touches this checkout.
  new-tests-fail-on-base:
    name: new tests must fail on the old code
    if: github.event_name == 'pull_request'
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the PR head with its history
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run the new tests against the base code
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          base="$(git merge-base HEAD "origin/${BASE_REF}")"
          uv run python scripts/new_tests_fail_on_base.py --base "$base" --head HEAD --workers auto

  # #363: the shipped runtime is Python 3.13 (app/build_python_runtime.sh) but
  # the job above runs 3.12. The bridge tests (threads, sockets, streaming, the
  # past order-dependent flakes) are the ones most likely to behave differently,
  # so they also run on 3.13. One OS keeps the cost to a few minutes.
  python-313-bridge:
    name: python 3.13 bridge tests (shipped runtime)
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-extras --python 3.13

      - name: Run bridge tests
        env:
          KINDLED_RUN_STRESS: "1"  # adds the 60s C15(c) write-lock stress test and its stand-in tests (#421, #540)
        run: uv run --python 3.13 pytest tests/bridge tests/unit/brain/bridge -v --tb=short

  # #740: `requires-python` has no upper bound, so a dev machine whose default Python is 3.14 builds its .venv there,
  # and a break that only shows on 3.14 passed CI twice (#678, #700). The whole suite, on one OS: both breaks were
  # OS-independent, and the macOS runner pool is short (#758). The CPU budget stays on the main matrix's Ubuntu leg,
  # so a slow runner can't fail it twice. Tests: tests/unit/scripts/test_ci_python_314.py.
  python-314:
    name: python 3.14 (full suite)
    if: github.event_name != 'workflow_dispatch'
    timeout-minutes: 120
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --all-extras --python 3.14

      # The main matrix's command (see its comment for -n / --dist / -p), with no path: the whole suite.
      - name: Run pytest
        run: uv run --python 3.14 pytest -n auto --dist loadgroup -p no:tdd-guard -v --tb=short

  # Audit 2026-05-07 P2-5: frontend tests + production build now gate
  # PRs the same way Python does. The previous release cycle's biggest
  # regressions were React/Tauri glue (wizard provider field, persona
  # threading, role-label leaks, stale bubbles); none would have been
  # caught by the python-only matrix.
  # Ubuntu, not macOS (#758): vitest and the tsc + vite build don't depend on the OS (release.yml's validate job runs
  # the same gate on Ubuntu), and the macOS arm64 runner pool is short; only jobs that need macOS wait for it.
  frontend:
    name: frontend (vitest + vite build)
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Install Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: pnpm install
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: pnpm test (vitest)
        working-directory: app
        run: pnpm test

      - name: pnpm build (tsc + vite)
        working-directory: app
        run: pnpm build

  # Audit 2026-05-07 P2-5: Rust check + test on every PR. Tauri
  # commands (port parsing, persona validation, app config healing,
  # nell_command resolution, subprocess timeouts) are mostly Rust;
  # without a CI gate, regressions only surface at release-build
  # time or on first user double-click.
  #
  # #758: GitHub's macOS arm64 pool is short of runners, so on a PR this job runs only when the PR changes
  # something the Rust build or its tests read (scripts/ci_touches_rust.py lists them). Every push to main
  # runs it, and tauri-linux-windows still builds and tests the workspace on every PR. It fails open: a
  # failed or skipped rust-changes job runs cargo.
  rust-changes:
    name: rust changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.diff.outputs.rust }}
    steps:
      # A PR checks out its merge commit; the first parent is the base tip, so HEAD^1..HEAD is the PR's diff.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Does the PR change what the Rust build reads?
        id: diff
        shell: bash
        run: git diff --name-only HEAD^1 HEAD | python3 scripts/ci_touches_rust.py >> "$GITHUB_OUTPUT"

  tauri:
    name: tauri (cargo check + test)
    needs: rust-changes
    if: >-
      !cancelled() && github.event_name != 'workflow_dispatch'
      && (needs.rust-changes.result != 'success' || needs.rust-changes.outputs.rust == 'true')
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: cargo check
        working-directory: app/src-tauri
        run: cargo check

      - name: cargo test
        working-directory: app/src-tauri
        run: cargo test --workspace --no-fail-fast

  # #408: the nell shortcut logic lives in the Tauri-free workspace crate nell_shortcut. This job
  # compiles the Tauri-linked glue on Linux and Windows (cargo check does not link a test binary),
  # runs the whole workspace's tests on Linux (the same gate release.yml's validate job runs, moved
  # to PR time) and the crate's tests on Windows. Windows runs ONLY the crate: a test executable of
  # a Tauri-linked crate does not start on Windows (upstream tauri #13419), and the rest of the
  # root crate's tests have never run there.
  tauri-linux-windows:
    name: tauri (${{ matrix.os }})
    if: github.event_name != 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Linux, install Tauri system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: cargo check
        working-directory: app/src-tauri
        run: cargo check

      - name: cargo test (workspace)
        if: runner.os == 'Linux'
        working-directory: app/src-tauri
        run: cargo test --workspace --no-fail-fast

      - name: smoke script logic (stub AppImages)
        if: always() && runner.os == 'Linux'
        run: bash scripts/test_appimage_cli_smoke.sh

      - name: cargo test (nell_shortcut crate)
        if: runner.os == 'Windows'
        working-directory: app/src-tauri
        run: cargo test -p nell_shortcut --no-fail-fast

  # #290: the built wheel was only exercised in release.yml, after the tag, so
  # a packaging break (missing package data or module, broken entry point)
  # surfaced as a release with no assets. The wheel is pure Python, so one OS
  # catches those; macOS because the smoke's unlocked install stays CPU-torch-
  # sized there even on a uv without UV_TORCH_BACKEND.
  wheel-smoke:
    name: wheel smoke (build + clean install)
    if: github.event_name != 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Wheel/sdist smoke
        run: bash scripts/smoke_test_wheel.sh

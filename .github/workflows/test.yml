name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual run of chosen tests on a chosen OS (only the `python` job runs; see below).
  workflow_dispatch:
    inputs:
      tests:
        description: >-
          Test paths or node ids, separated by spaces (default: the whole suite).
          Example: tests/bridge/test_x.py::test_y
        type: string
        required: false
        default: ""
      os:
        description: Which OS to run on
        type: choice
        options:
          - all
          - ubuntu-latest
          - macos-latest
          - windows-latest
        default: all
      workers:
        description: >-
          pytest-xdist worker processes (#540): 1 is the serial run, auto is one worker per CPU.
          Any other value than 1 also switches on --dist loadgroup and turns off the tdd-guard plugin.
        type: choice
        options:
          - "1"
          - "2"
          - "4"
          - "auto"
        default: "1"

jobs:
  python:
    name: python ${{ matrix.os }}
    # A hung parallel trial must not hold a runner for the default six hours.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # Push and pull_request: all three OSes. A manual run narrows this to the
        # chosen OS (`os` is a choice input, so only the four listed values exist).
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.os != 'all' && format('["{0}"]', inputs.os) || '["ubuntu-latest","macos-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run pytest
        if: github.event_name != 'workflow_dispatch'
        run: uv run pytest -v --tb=short --durations=100 --junitxml=pytest-junit.xml

      # Manual run only. The inputs reach the shell as environment variables (never
      # spliced into the script). TESTS is split on all whitespace (newlines included) with
      # globbing switched off, and every word is passed to pytest as one quoted argument.
      # WORKERS other than 1 runs pytest-xdist: `--dist loadgroup` keeps each xdist_group
      # mark's tests on one worker (the tests sharing a real resource), and `-p no:tdd-guard`
      # stops the tdd-guard plugin, which every worker would otherwise load and make write the
      # same status file. The push and pull_request run above stays serial until the suite is
      # switched over. `shell: bash` so the same script runs on all three OSes (Windows would
      # otherwise use pwsh).
      - name: Run pytest (selected tests)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          TESTS: ${{ inputs.tests }}
          WORKERS: ${{ inputs.workers }}
        run: |
          case "$WORKERS" in
            1|2|4|auto) ;;
            *) echo "::error::refusing workers '$WORKERS': use 1, 2, 4 or auto"; exit 1 ;;
          esac
          set -f
          selected=($TESTS)
          set +f
          for word in "${selected[@]}"; do
            case "$word" in
              -*) echo "::error::refusing '$word': pass test paths or node ids only, not pytest options"; exit 1 ;;
            esac
          done
          parallel=()
          if [ "$WORKERS" != "1" ]; then
            parallel=(-n "$WORKERS" --dist loadgroup -p no:tdd-guard)
          fi
          uv run pytest -v --tb=short --durations=100 --junitxml=pytest-junit.xml "${parallel[@]}" "${selected[@]}"

      # Per-test timings (#540): the junit file carries every test's duration so
      # the slow ones can be found per OS.
      - name: Upload pytest junit report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pytest-junit-${{ matrix.os }}
          path: pytest-junit.xml
          if-no-files-found: warn

      - name: Lint with ruff
        if: github.event_name != 'workflow_dispatch'
        run: uv run ruff check .

  # #363: the shipped runtime is Python 3.13 (app/build_python_runtime.sh) but
  # the job above runs 3.12. The bridge tests (threads, sockets, streaming, the
  # past order-dependent flakes) are the ones most likely to behave differently,
  # so they also run on 3.13. One OS keeps the cost to a few minutes.
  python-313-bridge:
    name: python 3.13 bridge tests (shipped runtime)
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-extras --python 3.13

      - name: Run bridge tests
        env:
          KINDLED_RUN_STRESS: "1"  # adds the 60s C15(c) write-lock stress test (#421)
        run: uv run --python 3.13 pytest tests/bridge tests/unit/brain/bridge -v --tb=short

  # Audit 2026-05-07 P2-5: frontend tests + production build now gate
  # PRs the same way Python does. The previous release cycle's biggest
  # regressions were React/Tauri glue (wizard provider field, persona
  # threading, role-label leaks, stale bubbles); none would have been
  # caught by the python-only matrix.
  frontend:
    name: frontend (vitest + vite build)
    if: github.event_name != 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Install Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: pnpm install
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: pnpm test (vitest)
        working-directory: app
        run: pnpm test

      - name: pnpm build (tsc + vite)
        working-directory: app
        run: pnpm build

  # Audit 2026-05-07 P2-5: Rust check + test on every PR. Tauri
  # commands (port parsing, persona validation, app config healing,
  # nell_command resolution, subprocess timeouts) are mostly Rust;
  # without a CI gate, regressions only surface at release-build
  # time or on first user double-click.
  tauri:
    name: tauri (cargo check + test)
    if: github.event_name != 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: cargo check
        working-directory: app/src-tauri
        run: cargo check

      - name: cargo test
        working-directory: app/src-tauri
        run: cargo test --workspace --no-fail-fast

  # #408: the nell shortcut logic lives in the Tauri-free workspace crate nell_shortcut. This job
  # compiles the Tauri-linked glue on Linux and Windows (cargo check does not link a test binary),
  # runs the whole workspace's tests on Linux (the same gate release.yml's validate job runs, moved
  # to PR time) and the crate's tests on Windows. Windows runs ONLY the crate: a test executable of
  # a Tauri-linked crate does not start on Windows (upstream tauri #13419), and the rest of the
  # root crate's tests have never run there.
  tauri-linux-windows:
    name: tauri (${{ matrix.os }})
    if: github.event_name != 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Linux, install Tauri system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: cargo check
        working-directory: app/src-tauri
        run: cargo check

      - name: cargo test (workspace)
        if: runner.os == 'Linux'
        working-directory: app/src-tauri
        run: cargo test --workspace --no-fail-fast

      - name: smoke script logic (stub AppImages)
        if: always() && runner.os == 'Linux'
        run: bash scripts/test_appimage_cli_smoke.sh

      - name: cargo test (nell_shortcut crate)
        if: runner.os == 'Windows'
        working-directory: app/src-tauri
        run: cargo test -p nell_shortcut --no-fail-fast

  # #290: the built wheel was only exercised in release.yml, after the tag, so
  # a packaging break (missing package data or module, broken entry point)
  # surfaced as a release with no assets. The wheel is pure Python, so one OS
  # catches those; macOS because the smoke's unlocked install stays CPU-torch-
  # sized there even on a uv without UV_TORCH_BACKEND.
  wheel-smoke:
    name: wheel smoke (build + clean install)
    if: github.event_name != 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Wheel/sdist smoke
        run: bash scripts/smoke_test_wheel.sh

# companion-emergence is NOT released by the generic tauri-release script.
#
# Canonical release = the manual six-file version-pin flow:
#   1. Bump pyproject.toml + app/src-tauri/Cargo.toml +
#      app/src-tauri/tauri.conf.json + app/package.json, then refresh
#      uv.lock (`uv lock`) and the nellface entry in app/src-tauri/Cargo.lock.
#   2. Add the release entry to CHANGELOG.md (docs/release-checklist.md).
#   3. Land the bump and the entry on main through a PR.
#   4. Run `bash scripts/release_preflight.sh <tag>` and see GREEN.
#   5. Tag via `gh api`, which triggers the GitHub Actions release build.
#
# The generic script does NOT understand pyproject.toml or uv.lock, and
# `origin` here is the PUBLIC repo (hanamorix/companion-emergence), where main
# changes only through a PR. The push and gh_release stages are DISABLED below
# so an accidental invocation can never push or publish a release. This file
# exists to make the routed `nell-tools:tauri-release` skill safe, not to
# automate this repo's release.

[project]
name = "companion-emergence"

[files]
package_json = "app/package.json"
cargo_toml = "app/src-tauri/Cargo.toml"
tauri_conf = "app/src-tauri/tauri.conf.json"

[stages]
build = false       # CI builds the release bundles (GitHub Actions on the version tag)
sign = false        # no local signing; CI builds are signed via the Actions workflow
push = false        # main changes only through a PR, so a release never pushes it
gh_release = false  # release bundles are built by GitHub Actions on the version tag

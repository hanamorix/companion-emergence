[project]
name = "companion-emergence"
version = "0.0.42"
description = "Local-first framework for Kindled — minds that live on your machine, remember, dream, and grow."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Hanamori" },
]
dependencies = [
    "platformdirs>=4.2",
    "numpy>=1.26",
    "cryptography>=43",
    "ddgs>=6.0",
    "httpx>=0.27",
    "mcp>=1.0.0,<2.0.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "tzdata>=2024.1",
    "fastembed>=0.4",
    "pypdf>=6",
    # F2a #250 inc6 (2026-09-18 owner ruling, "torch it is then"): the
    # OFFLINE daily calibration judge (bge-reranker-v2-m3, brain/memory/
    # relevance_judge.py) loads directly via torch/sentence-transformers,
    # NOT fastembed/onnxruntime — the one place in this codebase torch is
    # used. It is imported lazily (only when the daily calibration tick
    # actually runs a judge pass), never on the per-turn hot path or at any
    # module's import time — the e5-large embedder and jina reranker stay
    # ONNX/onnxruntime, torch-free (see model_tier.py's TIER_RELEVANCE_JUDGE
    # comment and relevance_judge.py's module docstring). Pinned to the
    # CPU-only wheel via the [tool.uv.index]/[tool.uv.sources] block below —
    # the judge runs offline on the no-AVX2 potato baseline, so pulling in
    # CUDA wheels would bloat the install footprint for no benefit.
    "torch>=2.2",
    "sentence-transformers>=3.0",
    # F2c inc5b-2 (Roy 2026-09-24, reversing the inc5a optional-extras
    # plan): the LoRA/full-FT judge weight-retrain training deps (peft +
    # datasets, brain/memory/judge_lora.py) are now BASE dependencies, not
    # an optional `f2c-training` extra. Reason: the feature must never
    # require a user to run pip/python to enable it — a capable box must be
    # able to train without a manual `uv sync --extra …` step. `torch` is
    # already a base dep (the daily calibration judge needs it), so the
    # added footprint is the `datasets` transitive chain (pandas/pyarrow/
    # aiohttp); accepted as the cost of zero-manual-step enablement.
    # `judge_selftune.py`'s tier-detect still downgrades to knob-refit on a
    # low-RAM / cgroup-capped box, so a potato never RUNS the training path
    # even though it now CARRIES the deps.
    #
    # `peft` pinned EXACT (not a range): peft's metadata declares an
    # unbounded `transformers` dependency, and `transformers` is only pulled
    # in transitively via sentence-transformers (locked at 5.17.0 in
    # uv.lock), so uv's resolver has no compatibility signal to check peft
    # against on its own. 0.21.0 is the version verified by hand against the
    # #3980 LoRA train/save/reload smoke test with transformers 5.17.0
    # (tests/unit/brain/memory/test_judge_lora.py); bumping peft, or letting
    # the locked transformers version move, needs re-verifying that test.
    "peft==0.21.0",
    # sentence-transformers 6.1.0's CrossEncoderTrainer hard-requires HF
    # `datasets` for ANY CrossEncoder training path (LoRA or full-FT).
    # Lower bound matches sbert's own `[train]`/`[dev]` extra.
    "datasets>=2.16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.scripts]
nell = "brain.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["brain"]

[tool.hatch.build.targets.sdist]
include = [
    "/brain",
    "/tests",
    "/scripts",
    "/README.md",
    "/INSTALL.md",
    "/pyproject.toml",
    "/uv.lock",
]
exclude = [
    "/app/src-tauri/python-runtime",
    "/app/src-tauri/target",
    "/app/node_modules",
    "/dist",
    "/.venv",
    "/bugs",
    "/mock-ups",
    "/.pytest_cache",
    "/.ruff_cache",
    "**/.DS_Store",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
pythonpath = ["."]
tdd_guard_project_root = "the project root"
markers = [
    "unit: unit tests",
    "integration: integration tests (deselect with '-m \"not integration\"')",
    "requires_claude_cli: marks tests that require the claude CLI to be on PATH",
    "live: token-spending live-harness runs (needs claude auth; exclude from default CI with -m 'not live')",
    "requires_network: marks tests that need real network access (e.g. downloading the real local embedding model) — excluded by the default fake-embedding-provider autouse fixture",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# wizard-validation holds a staged .app whose bundled python-runtime
# (stdlib + site-packages) must never count against the repo gate.
extend-exclude = ["wizard-validation", "migrated-nell"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "C4", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["N802"]

[dependency-groups]
dev = [
    "tdd-guard-pytest>=0.1.2",
]

# F2a #250 inc6: pin torch to the CPU-only wheel variant (PyTorch's own
# index, not PyPI's default GPU/CUDA-bundled wheel) — the offline
# calibration judge runs on CPU only (potato baseline, per build-for-
# potato-computers-baseline), so CUDA wheels would only bloat the install
# footprint. `explicit = true` means this index is used ONLY for packages
# that name it via [tool.uv.sources] below, never as a general fallback.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
